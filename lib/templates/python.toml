[project]
name = "{{project_name}}"
description = "Deco Python uv development environment"

[image]
name = "{{image_name}}"

[build]
context = ".deco/build"
containerfile = "Containerfile"
pull = true
no_cache = false

[build.args]
PYTHON_VERSION = "3.15"
ADDITIONAL_PACKAGES = ""

[user]
name = "dev"
mode = "keep-id"

[container]
name = "{{container_name}}"
workdir = "/workspace"
shell = "bash"
cap_drop = ["ALL"]

# OPTIONAL: Podman-managed secrets are applied when the container is created.
# [[container.secrets]]
# name = "example-token"
# type = "env"
# target = "EXAMPLE_TOKEN"

[container.environment]
UV_LINK_MODE = "copy"

[network]
mode = "pasta"

# OPTIONAL: Publish a port only on loopback by default.
# [[network.ports]]
# host = 3000
# container = 3000
# bind = "127.0.0.1"

[mounts.workspace]
source = "."
target = "/workspace"
relabel = "private"

[actions]
sync = "uv sync"
test = "uv run pytest tests/"

# OPTIONAL: Extra bind mounts, devices, capabilities, privileged mode, and host
# namespaces expand the environment's access to the host. Add them only after
# reviewing the security implications in the Deco documentation.
