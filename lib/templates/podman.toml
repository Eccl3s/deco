[project]
name = "{{project_name}}"
description = "Podman development environment"

[image]
name = "{{image_name}}"

[build]
context = ".deco/build"
containerfile = "Containerfile"
pull = true
no_cache = false

[build.args]
ADDITIONAL_PACKAGES = ""

[user]
name = "podman"
mode = "keep-id"

[container]
name = "{{container_name}}"
workdir = "/workspace"
shell = "bash"
devices = ["/dev/fuse"]
security_options = ["label=disable"]
# No cap_add: the base image's io.containers.capabilities label already grants
# what nested rootless Podman needs, and Podman cannot add capabilities outside
# that label, so Deco refuses cap_add entries it excludes.

# OPTIONAL: Add environment variables only when they are safe to store here.
# [container.environment]
# LOG_LEVEL = "debug"

# OPTIONAL: Podman-managed secrets are applied when the container is created.
# [[container.secrets]]
# name = "example-token"
# type = "env"
# target = "EXAMPLE_TOKEN"

[network]
mode = "pasta"

# OPTIONAL: Publish a port only on loopback by default.
# [[network.ports]]
# host = 3000
# container = 3000
# bind = "127.0.0.1"

[mounts.workspace]
source = "."
target = "/workspace"
relabel = "private"

[actions]
hello-world = "podman run hello-world"

# OPTIONAL: Extra bind mounts, devices, capabilities, privileged mode, and host
# namespaces expand the environment's access to the host. Add them only after
# reviewing the security implications in the Deco documentation.
