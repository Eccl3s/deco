name: Deco CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Linux / OCaml 5.5.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OCaml 5.5.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.2'

      - name: Verify OCaml version
        shell: bash
        run: |
          test "$(opam exec -- ocamlc -version)" = '5.5.2'

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Check compilation
        run: opam exec -- dune build @check

      - name: Run tests
        run: opam exec -- dune runtest

  formatting:
    name: OCamlFormat (OCaml 5.5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.2'
      - uses: ocaml/setup-ocaml/lint-fmt@v3

  opam-validation:
    name: Validate opam metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up OCaml 5.5.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.2'

      - name: Validate opam package
        run: opam lint deco.opam
