name: Deco prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.2'
      - name: Verify and prepare tagged source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(opam exec -- ocamlc -version)" = '5.5.2'
          python3 tools/release/prepare.py source "$TAG" "$RUNNER_TEMP/dist"
      - name: Install verification tools
        run: |
          opam install . --deps-only --with-test
          opam install ocamlformat.0.29.0
      - name: Verify checkout
        run: |
          opam exec -- dune build --pkg=disabled
          opam exec -- dune build --pkg=disabled @check
          opam exec -- dune build --pkg=disabled @fmt
          opam lint deco.opam
          opam exec -- dune runtest --pkg=disabled
          opam exec -- dune build --pkg=disabled @test-shell-pty
          opam exec -- dune build --pkg=disabled @test-release
      - name: Verify Git-free source and package binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          unpack="$RUNNER_TEMP/source"
          mkdir -p "$unpack"
          tar -xzf "$RUNNER_TEMP/dist/deco-$version.tar.gz" -C "$unpack"
          source_dir="$unpack/deco-$version"
          (cd "$source_dir" && opam exec -- dune build --pkg=disabled && opam exec -- dune build --pkg=disabled @check && opam exec -- dune runtest --pkg=disabled && opam exec -- dune build --pkg=disabled @test-shell-pty)
          test "$("$source_dir/_build/default/bin/deco.exe" --version)" = "$version"
          python3 tools/release/prepare.py binary "$TAG" "$RUNNER_TEMP/dist" "$source_dir" "$(git show -s --format=%ct "refs/tags/${TAG}^{commit}")"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  binary-smoke:
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Test binary without OCaml setup
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          version="${TAG#v}"
          sha256sum -c "deco-$version-linux-x86_64.tar.gz.sha256"
          tar -xzf "deco-$version-linux-x86_64.tar.gz"
          binary="$PWD/deco-$version-linux-x86_64/deco"
          test "$("$binary" --version)" = "$version"
          "$binary" --help
          project_dir="$(mktemp -d)"
          "$binary" init "$project_dir"
          "$binary" --project-dir "$project_dir" validate

  sign:
    needs: [verify, binary-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'
      - name: Sign and verify artifacts
        run: |
          cd dist
          sha256sum -c *.sha256
          for artifact in *.tar.gz *.sha256; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            cosign verify-blob --bundle "$artifact.sigstore.json" --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$artifact"
          done
          archive="$(find . -maxdepth 1 -name '*.tar.gz' | sort | head -n 1)"
          cp "$archive" "$RUNNER_TEMP/tampered-artifact"
          printf tampered >> "$RUNNER_TEMP/tampered-artifact"
          if cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RUNNER_TEMP/tampered-artifact"; then
            echo 'Tampered artifact incorrectly verified' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-files
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, binary-smoke, sign]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-files
          path: dist
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c *.sha256
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          notes="$RUNNER_TEMP/release-notes.txt"
          cat > "$notes" <<NOTES
          Experimental prerelease. The x86_64 Linux binary requires glibc 2.35+ and local Podman; Alpine/musl is unsupported.

          Check an archive: sha256sum -c ARTIFACT.sha256
          Verify its signature: cosign verify-blob --bundle ARTIFACT.sigstore.json --certificate-identity https://github.com/$GITHUB_WORKFLOW_REF --certificate-oidc-issuer https://token.actions.githubusercontent.com ARTIFACT
          NOTES
          gh release create "$TAG" --verify-tag --prerelease --draft --title "$TAG" --notes-file "$notes" ./*.tar.gz ./*.sha256 ./*.sigstore.json
          gh release edit "$TAG" --draft=false --prerelease
